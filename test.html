<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMIL VM - Pro Player</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --mx-blue: #0078ff; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; }

        /* Full Screen Player Container */
        .video-container { position: relative; width: 100vw; height: 100vh; }
        .video-js { width: 100% !important; height: 100% !important; }

        /* Custom MX Overlay */
        #mx-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column;
            justify-content: space-between; background: rgba(0,0,0,0.3);
            transition: opacity 0.3s;
        }

        /* Top Bar */
        .top-bar { padding: 15px; display: flex; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .channel-name { color: white; font-size: 1.2rem; margin-left: 15px; flex-grow: 1; }

        /* Center Controls (Lock/Unlock) */
        .center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .lock-btn { color: white; font-size: 2rem; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 50%; cursor: pointer; }

        /* Bottom Controls */
        .bottom-bar { padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); }
        .mx-controls-row { display: flex; justify-content: space-around; align-items: center; color: white; margin-top: 10px; }
        .mx-btn { cursor: pointer; font-size: 1.4rem; padding: 10px; }
        .mx-btn:hover { color: var(--mx-blue); }

        /* Aspect Ratio Logic */
        .video-js.vjs-fill video { object-fit: fill !important; }
        .video-js.vjs-contain video { object-fit: contain !important; }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div class="video-container" id="player-wrapper">
    <video id="tamil-vm-player" class="video-js vjs-big-play-centered vjs-contain"></video>

    <div id="mx-overlay">
        <div class="top-bar">
            <i class="fa fa-arrow-left mx-btn" onclick="window.history.back()"></i>
            <div class="channel-name" id="display-name">TAMIL VM LIVE TV</div>
            <i class="fa fa-expand mx-btn" onclick="toggleFullScreen()"></i>
        </div>

        <div class="center-controls">
            <div class="lock-btn" id="lock-toggle" onclick="toggleLock()"><i class="fa fa-unlock"></i></div>
        </div>

        <div class="bottom-bar" id="bottom-ui">
            <div class="mx-controls-row">
                <span class="mx-btn" onclick="changeRatio()">Ratio <i class="fa fa-vector-square"></i></span>
                <span class="mx-btn" onclick="changeSpeed()">Speed <i class="fa fa-gauge-high"></i></span>
                <span class="mx-btn" onclick="alert('Subtitle Options')"><i class="fa fa-closed-captioning"></i></span>
            </div>

            <div class="mx-controls-row">
                <i class="fa fa-backward-step mx-btn" onclick="rewind()"></i>
                <i class="fa fa-play mx-btn" id="play-pause" onclick="playToggle()"></i>
                <i class="fa fa-forward-step mx-btn" onclick="forward()"></i>
            </div>
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
    const player = videojs('tamil-vm-player', {
        controls: false, // Using our custom MX UI
        autoplay: true,
        preload: 'auto',
        fluid: true,
        sources: [{
            src: 'https://vmfm.github.io/tamilvmtv/live/channels.m3u', // Replace with specific .m3u8 from your file
            type: 'application/x-mpegURL'
        }]
    });

    let isLocked = false;
    const overlay = document.getElementById('mx-overlay');
    const bottomUI = document.getElementById('bottom-ui');
    const lockIcon = document.querySelector('#lock-toggle i');

    // 1. Play/Pause Toggle
    function playToggle() {
        if (isLocked) return;
        const btn = document.getElementById('play-pause');
        if (player.paused()) {
            player.play();
            btn.className = "fa fa-pause mx-btn";
        } else {
            player.pause();
            btn.className = "fa fa-play mx-btn";
        }
    }

    // 2. Aspect Ratio (MX Player Fit/Fill)
    let ratios = ['vjs-contain', 'vjs-fill'];
    let currentRatio = 0;
    function changeRatio() {
        if (isLocked) return;
        const el = document.getElementById('tamil-vm-player');
        el.classList.remove(ratios[currentRatio]);
        currentRatio = (currentRatio + 1) % ratios.length;
        el.classList.add(ratios[currentRatio]);
    }

    // 3. Playback Speed
    let speeds = [1, 1.25, 1.5, 2];
    let currentSpeed = 0;
    function changeSpeed() {
        if (isLocked) return;
        currentSpeed = (currentSpeed + 1) % speeds.length;
        player.playbackRate(speeds[currentSpeed]);
        alert("Speed: " + speeds[currentSpeed] + "x");
    }

    // 4. Lock Screen
    function toggleLock() {
        isLocked = !isLocked;
        if (isLocked) {
            lockIcon.className = "fa fa-lock";
            bottomUI.style.display = "none";
            document.querySelector('.top-bar').style.display = "none";
        } else {
            lockIcon.className = "fa fa-unlock";
            bottomUI.style.display = "block";
            document.querySelector('.top-bar').style.display = "flex";
        }
    }

    // 5. Seek Functions
    function forward() { player.currentTime(player.currentTime() + 10); }
    function rewind() { player.currentTime(player.currentTime() - 10); }

    // Auto-hide UI
    let timeout;
    document.getElementById('player-wrapper').addEventListener('mousemove', () => {
        overlay.classList.remove('hidden');
        clearTimeout(timeout);
        timeout = setTimeout(() => { if(!player.paused()) overlay.classList.add('hidden'); }, 3000);
    });

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }
</script>

</body>
</html>
