<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMIL VM - LIVE TV</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root { --mx-blue: #0078ff; --panel-bg: rgba(20, 20, 20, 0.95); }
        body, html { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; height: 100%; overflow: hidden; }

        /* Main Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* Video Section */
        #video-wrapper { position: relative; flex-grow: 1; background: #000; overflow: hidden; }
        .video-js { width: 100% !important; height: 100% !important; }
        .vjs-fill video { object-fit: fill !important; }

        /* MX Style Overlay */
        #mx-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column;
            justify-content: space-between; background: rgba(0,0,0,0.4);
            transition: opacity 0.4s;
        }

        .top-bar { padding: 15px; display: flex; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        .bottom-bar { padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); }
        
        .channel-info { flex-grow: 1; margin-left: 15px; }
        .channel-title { font-size: 1.1rem; font-weight: bold; display: block; }

        /* Channel Sidebar (Slide-in) */
        #sidebar {
            position: absolute; right: -300px; top: 0; width: 300px; height: 100%;
            background: var(--panel-bg); z-index: 20; transition: 0.3s;
            overflow-y: auto; border-left: 1px solid #333;
        }
        #sidebar.active { right: 0; }
        .channel-item { 
            padding: 12px; border-bottom: 1px solid #222; cursor: pointer; 
            display: flex; align-items: center; transition: 0.2s;
        }
        .channel-item:hover { background: #333; }
        .channel-item img { width: 40px; height: 40px; border-radius: 4px; margin-right: 12px; object-fit: cover; }

        /* Controls */
        .mx-btn { cursor: pointer; font-size: 1.3rem; padding: 10px; transition: 0.2s; }
        .mx-btn:hover { color: var(--mx-blue); }
        .mx-row { display: flex; justify-content: space-around; align-items: center; }
        
        .hidden { opacity: 0; pointer-events: none; }
        .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="video-wrapper">
        <div id="loader" class="loader"><i class="fa fa-spinner fa-spin fa-2x"></i><p>Loading Channels...</p></div>
        
        <video id="main-player" class="video-js vjs-big-play-centered"></video>

        <div id="mx-overlay" class="hidden">
            <div class="top-bar">
                <i class="fa fa-bars mx-btn" onclick="toggleSidebar()"></i>
                <div class="channel-info">
                    <span class="channel-title" id="current-ch-name">Tamil VM TV</span>
                    <small style="color: #ccc;">Live Streaming</small>
                </div>
                <i class="fa fa-expand mx-btn" onclick="toggleFS()"></i>
            </div>

            <div class="bottom-bar">
                <div class="mx-row" style="margin-bottom: 15px;">
                    <span class="mx-btn" onclick="changeRatio()"><i class="fa fa-vector-square"></i> Ratio</span>
                    <span class="mx-btn" onclick="changeSpeed()"><i class="fa fa-gauge-high"></i> Speed</span>
                    <span class="mx-btn" onclick="toggleSidebar()"><i class="fa fa-list"></i> Channels</span>
                </div>
                <div class="mx-row">
                    <i class="fa fa-rotate-left mx-btn" onclick="seek(-10)"></i>
                    <i class="fa fa-play mx-btn" id="play-btn" onclick="togglePlay()" style="font-size: 2rem;"></i>
                    <i class="fa fa-rotate-right mx-btn" onclick="seek(10)"></i>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div style="padding: 20px; font-weight: bold; border-bottom: 1px solid #444;">CHANNEL LIST</div>
            <div id="channel-list-container"></div>
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
    const M3U_URL = 'https://vmfm.github.io/tamilvmtv/live/channels.m3u';
    const player = videojs('main-player', { autoplay: true, controls: false, fluid: true });
    let channels = [];

    // 1. Fetch and Parse M3U
    async function loadM3U() {
        try {
            const response = await fetch(M3U_URL);
            const data = await response.text();
            parseM3U(data);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('mx-overlay').classList.remove('hidden');
        } catch (err) {
            alert("Error loading playlist. Check internet or CORS policy.");
        }
    }

    function parseM3U(text) {
        const lines = text.split('\n');
        const container = document.getElementById('channel-list-container');
        
        for (let i = 0; i < lines.length; i++) {
            if (lines[i].startsWith('#EXTINF')) {
                const info = lines[i];
                const url = lines[i + 1]?.trim();
                const name = info.split(',')[1] || "Unknown Channel";
                const logoMatch = info.match(/tvg-logo="([^"]+)"/);
                const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/50';

                if (url && url.startsWith('http')) {
                    const chObj = { name, url, logo };
                    channels.push(chObj);
                    createChannelItem(chObj);
                }
            }
        }
        // Play first channel automatically
        if (channels.length > 0) playChannel(0);
    }

    function createChannelItem(ch) {
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerHTML = `<img src="${ch.logo}"> <span>${ch.name}</span>`;
        div.onclick = () => {
            playChannel(channels.indexOf(ch));
            toggleSidebar();
        };
        document.getElementById('channel-list-container').appendChild(div);
    }

    function playChannel(index) {
        const ch = channels[index];
        document.getElementById('current-ch-name').innerText = ch.name;
        player.src({ src: ch.url, type: 'application/x-mpegURL' });
        player.play();
    }

    // 2. UI Interactions
    function togglePlay() {
        if (player.paused()) { player.play(); document.getElementById('play-btn').className = "fa fa-pause mx-btn"; }
        else { player.pause(); document.getElementById('play-btn').className = "fa fa-play mx-btn"; }
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    
    function changeRatio() {
        const v = document.getElementById('main-player');
        v.classList.toggle('vjs-fill');
        alert(v.classList.contains('vjs-fill') ? "Aspect: Stretch" : "Aspect: Fit");
    }

    function seek(amount) { player.currentTime(player.currentTime() + amount); }

    function toggleFS() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    }

    // Auto-hide Overlay
    let idleTimer;
    document.getElementById('video-wrapper').addEventListener('click', () => {
        document.getElementById('mx-overlay').classList.remove('hidden');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            if (!player.paused()) document.getElementById('mx-overlay').classList.add('hidden');
        }, 4000);
    });

    loadM3U();
</script>
</body>
</html>
